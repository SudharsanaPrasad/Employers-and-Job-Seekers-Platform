spring.application.name=careernest

# render sets PORT, on my laptop it uses 8080
server.port=${PORT:8080}

# these values are taken from environment variables
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DATABASE:careernest_db}
spring.data.mongodb.auto-index-creation=true

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# twilio keys. if they are empty the sms is only printed in the log
twilio.account-sid=${TWILIO_ACCOUNT_SID:}
twilio.auth-token=${TWILIO_AUTH_TOKEN:}
twilio.from-number=${TWILIO_FROM_NUMBER:}

springdoc.swagger-ui.path=/swagger-ui.html
