spring.application.name=careernest

# the platform sets PORT in production; default to 8080 locally
server.port=${PORT:8080}

# MongoDB and secrets come from environment variables so nothing sensitive is
# committed (same URI works locally and on Render/Atlas).
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DATABASE:careernest_db}
spring.data.mongodb.auto-index-creation=true

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# Twilio SMS - credentials from the environment. When they are blank the app still
# runs and SMS sends are skipped (logged); set them to enable real SMS.
twilio.account-sid=${TWILIO_ACCOUNT_SID:}
twilio.auth-token=${TWILIO_AUTH_TOKEN:}
twilio.from-number=${TWILIO_FROM_NUMBER:}

springdoc.swagger-ui.path=/swagger-ui.html
