# Tests do not talk to Atlas or Twilio; a dummy local URI lets the context start
# (the Mongo driver connects lazily, so no server is contacted unless a query runs).
spring.data.mongodb.uri=mongodb://localhost:27017/careernest_test
spring.data.mongodb.auto-index-creation=false

jwt.secret=test-only-secret-not-used-outside-tests-abcdefghijklmnopqrstuvwxyz
jwt.expiration-ms=86400000

twilio.account-sid=
twilio.auth-token=
twilio.from-number=
